<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>台股策略儀表板</title>
<style>
  :root {
    --bg:#0b0e14; --card:#151a24; --card-border:#232937;
    --text:#e6e6e6; --text-dim:#8b95a5;
    --green:#2ecc71; --red:#ff5c5c; --yellow:#f5c542; --blue:#4da8ff; --accent:#6b7bff;
  }
  *{box-sizing:border-box}
  /* The dark background goes on html too, and the page fills the viewport:
     otherwise iOS shows the WebView's white backing below a short page
     (e.g. an almost-empty 歷史 tab). */
  html{background:var(--bg);color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif;
    padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .content{padding:14px 16px 20px;max-width:560px;margin:0 auto}

  .market-bar{display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--card-border);border-radius:12px;padding:9px 14px;
    font-size:12px;margin-bottom:8px;color:var(--text-dim);flex-wrap:wrap}
  .market-bar .date{margin-left:auto}
  .gate-warn{background:rgba(255,92,92,0.1);border:1px solid rgba(255,92,92,0.35);
    color:#ffb3b3;border-radius:12px;padding:9px 14px;font-size:12px;margin-bottom:16px;line-height:1.5}

  .todo-block{border-radius:16px;padding:14px;margin-bottom:14px}
  .todo-block.sell{background:linear-gradient(145deg,rgba(255,92,92,.16),rgba(255,92,92,.05));
    border:1.5px solid rgba(255,92,92,.4)}
  .todo-block.buy{background:linear-gradient(145deg,rgba(46,204,113,.16),rgba(46,204,113,.05));
    border:1.5px solid rgba(46,204,113,.4)}
  .todo-block.none{background:var(--card);border:1px solid var(--card-border);
    text-align:center;color:var(--text-dim);font-size:13px;padding:18px}
  .todo-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:10px}
  .todo-head.sell-text{color:var(--red)} .todo-head.buy-text{color:var(--green)}
  .todo-head .n{font-size:11px;font-weight:700;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:8px}

  .action-card{background:rgba(0,0,0,.22);border-radius:12px;padding:12px;margin-bottom:8px}
  .action-card:last-child{margin-bottom:0}
  .ac-top{display:flex;align-items:baseline;gap:8px}
  .ac-top .id{font-size:16px;font-weight:800}
  .ac-top .name{font-size:13px;color:var(--text-dim)}
  .ac-top .price{margin-left:auto;font-size:16px;font-weight:800}
  .ac-top .pct{font-size:12px;font-weight:700}
  .pct.up{color:var(--green)} .pct.down{color:var(--red)}
  .ac-reason{margin-top:6px;font-size:12.5px;font-weight:600;line-height:1.5}
  .ac-reason.sell-c{color:#ffb3b3} .ac-reason.buy-c{color:#a8f0c6}
  .ac-sub{margin-top:6px;font-size:11px;color:var(--text-dim)}
  .stop-chip{display:inline-block;margin-top:8px;font-size:11px;color:var(--text-dim);
    background:rgba(255,255,255,.06);padding:4px 9px;border-radius:8px}

  .section-title{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
    color:var(--text-dim);letter-spacing:.5px;margin:22px 0 10px}
  .section-title .count{background:var(--card-border);color:var(--text);
    border-radius:8px;padding:1px 7px;font-size:11px}

  .card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;
    padding:13px 14px;margin-bottom:8px}
  .card-head{display:flex;align-items:baseline;gap:8px}
  .card-head .id{font-size:14px;font-weight:700}
  .card-head .name{font-size:12.5px;color:var(--text-dim)}
  .card-head .price{margin-left:auto;font-size:15px;font-weight:700}
  .card-head .pct{font-size:11.5px;font-weight:600}
  .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;
    font-size:10.5px;color:var(--text-dim)}
  .meta-grid .val{display:block;font-size:13px;font-weight:700;color:var(--text);margin-top:2px}
  .source-tag{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:6px}
  .source-tag.sim{background:rgba(77,168,255,.15);color:var(--blue)}
  .source-tag.real{background:rgba(245,197,66,.15);color:var(--yellow)}
  .trail-tag{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:6px;
    background:rgba(46,204,113,.15);color:var(--green)}
  .ac-top .name,.card-head .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .quote-line{margin-top:6px;font-size:11px;color:var(--text-dim)}
  .quote-line b{color:var(--text)}
  .ohlc{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:9px;padding:8px 10px;
    background:rgba(255,255,255,.03);border-radius:9px;font-size:10.5px;color:var(--text-dim)}
  .ohlc .val{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin-top:1px}
  .ohlc-foot{grid-column:1/-1;font-size:10px;margin-top:3px}
  details.exit-plan{margin-top:9px;border-top:1px solid var(--card-border);padding-top:8px}
  details.exit-plan summary{font-size:11.5px;font-weight:700;cursor:pointer;list-style:none;color:var(--text)}
  details.exit-plan summary::-webkit-details-marker{display:none}
  details.exit-plan summary .hint{color:var(--text-dim);font-weight:600}
  .exit-row{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--card-border);font-size:11.5px;line-height:1.5}
  .exit-row:last-of-type{border-bottom:none}
  .exit-row .ico{width:18px;flex:none}
  .exit-row .body{flex:1}
  .exit-row .lvl{font-weight:800}
  .exit-row .st{display:block;color:var(--text-dim);font-size:10.5px}
  .exit-row.hot .lvl{color:var(--red)}
  .exit-note{font-size:10.5px;color:var(--text-dim);line-height:1.6;margin-top:6px}
  .watch-note{margin-top:8px;font-size:11px;color:#f0dc9e;background:rgba(245,197,66,.08);
    padding:6px 9px;border-radius:8px;line-height:1.5}

  button{font-family:inherit;cursor:pointer}
  .btn-primary{width:100%;padding:11px;border:none;border-radius:10px;background:var(--green);
    color:#0b0e14;font-size:12.5px;font-weight:800}
  .btn-outline{width:100%;padding:12px;border:1.5px dashed var(--card-border);border-radius:14px;
    background:transparent;color:var(--text-dim);font-size:12.5px;font-weight:700;margin-bottom:8px}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
  .stat-box{background:rgba(255,255,255,.03);border-radius:10px;padding:10px;text-align:center}
  .stat-box .num{font-size:18px;font-weight:800}
  .stat-box .num.g{color:var(--green)} .stat-box .num.r{color:var(--red)}
  .stat-box .label{font-size:10px;color:var(--text-dim);margin-top:2px}

  .hist-row{display:flex;align-items:center;gap:8px;padding:10px 0;
    border-bottom:1px solid var(--card-border);font-size:12px}
  .hist-row:last-child{border-bottom:none}
  .hist-row .id{font-weight:700;width:44px}
  .hist-row .dates{color:var(--text-dim);font-size:10.5px;flex:1}
  .hist-row .pnl{font-weight:800;font-size:13px}

  .tab-page{display:none} .tab-page.active{display:block}
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;
    border-top:1px solid var(--card-border);padding:8px 0 max(20px, env(safe-area-inset-bottom));background:#0f1219}
  .tabbar .tab{flex:1;text-align:center;font-size:11px;color:var(--text-dim);
    background:none;border:none}
  .tabbar .tab.active{color:var(--accent);font-weight:700}
  .tabbar .tab .icon{font-size:18px;display:block;margin-bottom:2px}

  .footer-note{text-align:center;font-size:11px;color:var(--text-dim);
    margin-top:22px;line-height:1.6;padding:0 8px}
  .loading{text-align:center;color:var(--text-dim);font-size:13px;padding:40px 0}
  .error-box{background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.35);
    color:#ffb3b3;border-radius:12px;padding:12px;font-size:12px;line-height:1.6}

  dialog{border:none;border-radius:16px;background:var(--card);color:var(--text);
    padding:18px;width:88%;max-width:360px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{margin:0 0 14px;font-size:15px}
  dialog label{display:block;font-size:11px;color:var(--text-dim);margin:10px 0 4px}
  /* 16px minimum: iOS Safari zooms into any smaller input on focus and
     doesn't zoom back out after the dialog closes. */
  dialog input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--card-border);
    background:#0f1219;color:var(--text);font-size:16px;font-family:inherit}
  dialog .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  dialog .calc{margin-top:12px;padding:9px 10px;border-radius:9px;background:rgba(255,255,255,.04);
    font-size:12px;line-height:1.7;color:var(--text-dim)}
  dialog .calc b{color:var(--text)}
  .summary-link{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:14px;
    background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:11px 14px;
    color:var(--text);font-size:12.5px}
  .summary-link .go{margin-left:auto;color:var(--text-dim)}
  .hold-tag{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:7px;
    background:rgba(245,197,66,.18);color:var(--yellow)}
  .month-table{width:100%;border-collapse:collapse;font-size:12px}
  .month-table th{font-size:10.5px;color:var(--text-dim);font-weight:600;text-align:right;padding:4px 0 6px}
  .month-table th:first-child,.month-table td:first-child{text-align:left}
  .month-table td{text-align:right;padding:7px 0;border-top:1px solid var(--card-border)}
  .month-head{font-size:11px;font-weight:700;color:var(--text-dim);margin:14px 2px 6px}
  .ev-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--card-border);font-size:12px}
  .ev-row:last-child{border-bottom:none}
  .ev-kind{flex:none;font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;height:fit-content}
  .ev-kind.buy{background:rgba(46,204,113,.15);color:var(--green)}
  .ev-kind.sell{background:rgba(255,92,92,.15);color:var(--red)}
  .ev-body{flex:1;line-height:1.55}
  .ev-body .sub{color:var(--text-dim);font-size:10.5px}
  .ev-amt{text-align:right;font-weight:800;white-space:nowrap}
  .btn-sell{font-size:13px!important}
  .card-actions{display:flex;gap:8px;margin-top:10px}
  .card-actions button{flex:1;padding:8px;border-radius:9px;font-size:12px;font-weight:700;border:none}
  .btn-sell{background:rgba(255,92,92,.18);color:#ffb3b3}
  .btn-void{background:rgba(255,255,255,.06);color:var(--text-dim)}
  .void-link{background:none;border:none;font-family:inherit;cursor:pointer;color:var(--text-dim);font-size:10.5px;padding:0;text-decoration:underline}
  .dialog-actions{display:flex;gap:8px;margin-top:16px}
  .dialog-actions button{flex:1;padding:10px;border-radius:9px;border:none;font-size:12.5px;font-weight:700}
  .btn-cancel{background:var(--card-border);color:var(--text)}
  .btn-save{background:var(--green);color:#0b0e14}
</style>
</head>
<body>
  <div class="content">
    <div id="boot" class="loading">載入中…</div>

    <div class="tab-page" id="page-today"></div>
    <div class="tab-page" id="page-holdings"></div>
    <div class="tab-page" id="page-records"></div>
    <div class="tab-page" id="page-sim"></div>
  </div>

  <div class="tabbar" id="tabbar" hidden>
    <button class="tab active" data-page="page-today"><span class="icon">🏠</span>今日</button>
    <button class="tab" data-page="page-holdings"><span class="icon">💰</span>我的持倉</button>
    <button class="tab" data-page="page-records"><span class="icon">🧾</span>交易紀錄</button>
    <button class="tab" data-page="page-sim"><span class="icon">🤖</span>系統模擬</button>
  </div>

  <dialog id="log-dialog">
    <h3>記錄真實買入</h3>
    <form id="log-form">
      <label>股票代號</label>
      <input name="stock_id" required inputmode="numeric" placeholder="2409">
      <label>買入價（每股 NT$）</label>
      <input name="buy_price" required inputmode="decimal" placeholder="30.0">
      <label>股數（1張 = 1000股）</label>
      <input name="shares" required inputmode="numeric" placeholder="2000">
      <label>買入日期</label>
      <input name="buy_date" type="date" required>
      <div class="row2">
        <div><label>手續費折數（例 6 折填 0.6）</label>
          <input name="discount" inputmode="decimal" placeholder="1"></div>
        <div><label>買進手續費 NT$</label>
          <input name="fee" inputmode="numeric" placeholder="自動計算"></div>
      </div>
      <div class="calc" id="buy-calc"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-cancel" data-close>取消</button>
        <button type="submit" class="btn-save">儲存</button>
      </div>
    </form>
  </dialog>

  <dialog id="sell-dialog">
    <h3 id="sell-title">記錄賣出</h3>
    <form id="sell-form">
      <div class="row2">
        <div><label>賣出價（每股 NT$）</label>
          <input name="price" required inputmode="decimal"></div>
        <div><label>賣出股數</label>
          <input name="shares" required inputmode="numeric"></div>
      </div>
      <label>賣出日期</label>
      <input name="date" type="date" required>
      <div class="row2">
        <div><label>賣出手續費 NT$</label>
          <input name="fee" inputmode="numeric" placeholder="自動計算"></div>
        <div><label>證交稅 NT$</label>
          <input name="tax" inputmode="numeric" placeholder="自動計算"></div>
      </div>
      <label>賣出原因（選填）</label>
      <input name="reason" placeholder="例：跌破月線、移動停利">
      <div class="calc" id="sell-calc"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-cancel" data-close>取消</button>
        <button type="submit" class="btn-save" style="background:var(--red);color:#fff">確認賣出</button>
      </div>
    </form>
  </dialog>

<!-- Official LINE CDN; the SDK is not published on cdnjs (that URL 404s). -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const SUPABASE_URL = "https://rkvlwhacptfdfkrdhdev.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dFonoJvJqfJpfh3Yme080A_enha9o5X";
const LIFF_ID = "2011648338-om5eZb72";

const sbHeaders = {apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY};
let profile = null;
let liffReady = false;  // liff.init succeeded, so liff.login() is available
let liffError = "";     // why LIFF couldn't start, shown on the holdings tab

async function sbGet(path) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, {headers: sbHeaders});
  if (!r.ok) throw new Error("Supabase " + r.status + ": " + (await r.text()).slice(0, 200));
  return r.json();
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pctClass = v => Number(v) >= 0 ? "up" : "down";
const fmtPct = v => (Number(v) >= 0 ? "+" : "") + Number(v).toFixed(1) + "%";
const md = d => d ? String(d).slice(5).replace("-", "/") : "";
// Trading dates are Taiwan dates; toISOString() would give the UTC date,
// which is still "yesterday" before 08:00 in Taipei.
const twToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);

// Filled by load(): latest price + name per ticker (Storage dashboard/quotes.json).
let quotes = {};
let names = {};
// Exit-rule parameters, published by the screener alongside the quotes so
// this page never drifts from the rules the simulation actually runs.
let rules = {trail_activation_pct: 10, trail_drawdown_pct: 5, ma20_exit_days: 2, slot_capital: 20000};
const nameTag = id => names[id] ? `<span class="name">${esc(names[id])}</span>` : "";
function quoteTime(q) {
  if (!q || !q.quote_time) return "";
  const t = new Date(q.quote_time);
  const d = new Date(t.getTime() + 8 * 3600e3).toISOString();
  const hm = d.slice(11, 16);
  return (d.slice(0, 10) === twToday() ? "" : md(d.slice(0, 10)) + " ") +
    (q.source === "close" ? "收盤" : hm);
}
// Mark a position to the freshest price we have: intraday quote, else the
// close the daily screen recorded, else the entry price.
function markPrice(p) {
  const q = quotes[p.stock_id];
  return Number(q?.price ?? p.current_price ?? p.entry_price);
}

function renderToday(state, exits) {
  const el = document.getElementById("page-today");
  let h = "";

  // One line about YOUR money; the detail lives on the 我的持倉 tab.
  if (profile && ledger.lots.length) {
    const v = ledger.lots.map(valueLot);
    const net = v.reduce((a, x) => a + x.netNow, 0), day = v.reduce((a, x) => a + x.dayChange, 0);
    h += `<button class="summary-link" data-goto="page-holdings">💰 我的持倉 ${ledger.lots.length} 檔
      · 淨損益 <b style="color:${net >= 0 ? "var(--green)" : "var(--red)"}">${nt(net)}</b>
      · 今日 <span class="pct ${pctClass(day)}">${nt(day)}</span><span class="go">›</span></button>`;
  }

  if (!state) {
    el.innerHTML = h + `<div class="error-box">尚無今日資料 —— 每個交易日早上約 08:45 更新。<br>
      若持續空白，可能是當日排程尚未執行。</div>`;
    return;
  }

  const gateBlocked = state.entries_allowed === false;
  const cands = gateBlocked ? [] : (state.long_candidates || []);
  const held = heldIds();
  const heldTag = id => held.has(id) ? `<span class="hold-tag">你有持有</span>` : "";

  h += `<div class="market-bar">
      <span>${esc(state.market_signal || "無大盤資料")}</span>
      <span class="date">${esc(state.run_date)}</span>
    </div>`;
  if (state.overnight_note) {
    h += `<div class="market-bar"><span>🌙 ${esc(state.overnight_note)}</span></div>`;
  }
  if (gateBlocked) {
    h += `<div class="gate-warn">⛔️ ${esc(state.gate_reason || "夜盤收黑")} — 依規則今日暫停新進場<br>
      （已持有的部位不受影響，仍照出場規則逐日檢查）</div>`;
  }

  if (exits.length) {
    h += `<div class="todo-block sell">
      <div class="todo-head sell-text">🔴 出場訊號 <span class="n">${exits.length}</span></div>` +
      exits.map(e => `<div class="action-card">
        <div class="ac-top"><span class="id">${esc(e.stock_id)}</span>${nameTag(e.stock_id)}${heldTag(e.stock_id)}
          <span class="price">${f2(e.exit_price)}</span></div>
        <div class="ac-reason sell-c">出場規則觸發：${esc(e.reason)}</div>
        <div class="ac-sub">${held.has(e.stock_id) ? "你持有這檔 — 依規則今天應賣出，賣了記得到「我的持倉」按賣出" :
          "系統模擬帳戶的持股；你沒有持有，僅供參考"}</div>
      </div>`).join("") + `</div>`;
  }

  if (cands.length) {
    h += `<div class="todo-block buy">
      <div class="todo-head buy-text">🟢 今天可以進場 <span class="n">${cands.length}</span></div>` +
      cands.map(c => `<div class="action-card">
        <div class="ac-top"><span class="id">${esc(c.stock_id)}</span>${nameTag(c.stock_id)}${heldTag(c.stock_id)}
          <span class="price">${f2(c.close)}</span>
          <span class="pct ${pctClass(c.today_pct)}">${fmtPct(c.today_pct)}</span></div>
        <div class="ac-reason buy-c">符合進場規則：${esc((c.reasons || []).join("／"))}</div>
        ${candQuoteLine(c)}
        ${c.stop_loss ? `<span class="stop-chip">停損 ${f2(c.stop_loss)}</span>` : ""}
        <button class="btn-primary" style="margin-top:10px"
          data-log="${esc(c.stock_id)}" data-price="${esc(c.close)}">📝 我買了這支 → 記錄真實持倉</button>
      </div>`).join("") + `</div>`;
  }

  if (!exits.length && !cands.length) {
    h += `<div class="todo-block none">✓ 今日沒有進出場訊號${gateBlocked ? "（夜盤收黑，暫停進場）" : ""}</div>`;
  }

function candQuoteLine(c) {

const f2 = v => Number(v).toFixed(2);
const nt = v => (v >= 0 ? "+" : "−") + "NT$" + Math.abs(Math.round(v)).toLocaleString();
const distPct = (from, to) => (to / from - 1) * 100;
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400e3);

// Today's bar: open / high / low / last (or close once the session is over).
function ohlcBlock(q) {
  if (!q || q.open == null) return "";
  const t = new Date(new Date(q.quote_time).getTime() + 8 * 3600e3).toISOString();
  const closed = q.source === "close" || t.slice(11, 16) >= "13:30" || t.slice(0, 10) < twToday();
  return `<div class="ohlc">
    <div>開<span class="val">${f2(q.open)}</span></div>
    <div>高<span class="val">${f2(q.high)}</span></div>
    <div>低<span class="val">${f2(q.low)}</span></div>
    <div>${closed ? "收" : "現"}<span class="val">${f2(q.price)}</span></div>
    <div class="ohlc-foot">${closed ? "收盤" : "盤中"}漲跌
      <span class="pct ${pctClass(q.change_pct)}">${fmtPct(q.change_pct || 0)}</span>
      ${q.volume_lots ? ` · 量 ${Number(q.volume_lots).toLocaleString()} 張` : ""} · ${esc(quoteTime(q))}</div>
  </div>`;
}

// Every rule that can close the position, with its trigger level and how
// far the current price is from it. Mirrors evaluate_long_exit (screen.py).
function exitPlan(p, price) {
  const q = quotes[p.stock_id] || {};
  const E = Number(p.entry_price), S = Number(p.stop_loss);
  const act = rules.trail_activation_pct, dd = rules.trail_drawdown_pct;
  const rows = [];

  if (S) rows.push({key: "停損", ico: "🛑", level: S, hot: price <= S,
    text: `收盤 ≤ <span class="lvl">${f2(S)}</span>`,
    st: `距現價 ${fmtPct(distPct(price, S))}｜觸發時損益約 ${fmtPct(distPct(E, S))}`});

  if (q.ma20) {
    const below = Number(p.below_ma20_days || 0);
    rows.push({key: "月線", ico: "📉", level: Number(q.ma20), hot: below >= 1,
      text: `收盤連續 ${rules.ma20_exit_days} 天低於月線 <span class="lvl">${f2(q.ma20)}</span>`,
      st: `距現價 ${fmtPct(distPct(price, q.ma20))}｜${below ? `已連續 ${below} 天收在月線下` : "目前收在月線上"}`
        + (q.ind_date ? `（MA20 為 ${md(q.ind_date)} 收盤值）` : "")});
  }

  if (p.trail_activated) {
    const hw = Number(p.high_water || price), trig = hw * (1 - dd / 100);
    rows.push({key: "移動停利", ico: "🎯", level: trig, hot: price <= trig,
      text: `已啟動：收盤 ≤ <span class="lvl">${f2(trig)}</span>（最高收盤 ${f2(hw)} 回落 ${dd}%）`,
      st: `距現價 ${fmtPct(distPct(price, trig))}｜觸發時損益約 ${fmtPct(distPct(E, trig))}`});
  } else {
    const on = E * (1 + act / 100);
    rows.push({key: "移動停利", ico: "🎯", level: null, hot: false,
      text: `收盤 ≥ <span class="lvl">${f2(on)}</span>（+${act}%）時啟動`,
      st: `距現價 ${fmtPct(distPct(price, on))}｜啟動後從最高收盤回落 ${dd}% 就賣，把大部分獲利留住`});
  }

  if (q.k != null) {
    rows.push({key: "技術轉弱", ico: "⚠️", level: null, hot: q.k < q.d && q.dif < 0,
      text: `KD 死亡交叉 且 MACD DIF < 0`,
      st: `目前 K ${q.k} / D ${q.d}，DIF ${q.dif}（${q.dif >= 0 ? "DIF 仍在 0 軸上，此條件不會觸發" : "DIF 已在 0 軸下"}）`});
  }

  // Summary line: the nearest price trigger below today's price.
  // Summary line: anything already at its trigger first, else the nearest
  // price trigger below today's price.
  const hit = rows.filter(r => r.hot && (!r.level || price <= r.level));
  const nearest = rows.filter(r => r.level && r.level < price).sort((a, b) => b.level - a.level)[0];
  const summary = hit.length
    ? `<span style="color:var(--red)">⚠️ 已觸及：${hit.map(r => r.key).join("、")}（看今天收盤）</span>`
    : nearest
      ? `最近的出場線：${nearest.key} ${f2(nearest.level)}（${fmtPct(distPct(price, nearest.level))}）`
      : "";

  return `<details class="exit-plan">
    <summary>📋 出場計畫 <span class="hint">${summary}　▾</span></summary>
    ${rows.map(r => `<div class="exit-row${r.hot ? " hot" : ""}"><span class="ico">${r.ico}</span>
      <span class="body"><b>${r.key}</b>　${r.text}<span class="st">${r.st}</span></span></div>`).join("")}
    <div class="exit-note">任一條件在「收盤」成立 → 隔天早上列入「該賣掉」。<br>
      沒有固定目標價或持有天數：趨勢還在就續抱，漲超過 ${act}% 後由移動停利鎖住獲利；
      另有「高位爆量收黑」出貨警訊也會出場。</div>
  </details>`;
}

// ── Real-trade ledger ───────────────────────────────────────────────────
// positions_manual is append-only from this page (the public key may insert
// and read, not update or delete), which also keeps a full audit trail:
//   status "open" = a buy lot     note: {"fee": buy fee}
//   status "sell" = a sale        note: {"ref": buy lot id, "fee", "tax"}
//                                 (exit_price/exit_date/shares = the sale)
//   status "void" = cancels a row note: {"ref": cancelled row id}
// A lot's remaining shares = its shares minus the sales that reference it.
const meta = r => { try { return JSON.parse(r.note || "{}") || {}; } catch (_) { return {}; } };
let ledger = {lots: [], trades: [], byId: {}, buys: []};

function buildLedger(rows) {
  const voided = new Set(rows.filter(r => r.status === "void").map(r => meta(r).ref));
  const live = rows.filter(r => r.status !== "void" && !voided.has(r.id));
  const buys = live.filter(r => r.status === "open");
  const sells = live.filter(r => r.status === "sell");
  const byId = Object.fromEntries(buys.map(b => [b.id, b]));
  const sold = {};
  for (const s of sells) sold[meta(s).ref] = (sold[meta(s).ref] || 0) + Number(s.shares);

  const lots = buys.map(b => {
    const shares = Number(b.shares), fee = Number(meta(b).fee || 0);
    const remaining = shares - (sold[b.id] || 0);
    return {...b, fee, remaining, feeLeft: fee * remaining / shares};
  }).filter(l => l.remaining > 0);

  const trades = sells.map(s => {
    const b = byId[meta(s).ref] || {};
    const n = Number(s.shares), m = meta(s);
    const buyFee = Number(meta(b).fee || 0) * n / Number(b.shares || n);
    const cost = Number(s.buy_price) * n + buyFee;
    const proceeds = Number(s.exit_price) * n - Number(m.fee || 0) - Number(m.tax || 0);
    return {...s, cost, proceeds, pnl: proceeds - cost, pnlPct: (proceeds / cost - 1) * 100,
            fees: buyFee + Number(m.fee || 0) + Number(m.tax || 0)};
  }).sort((a, b) => String(b.exit_date).localeCompare(String(a.exit_date)));

  ledger = {lots, trades, byId, buys};
}

// Taiwan costs: brokerage 0.1425% × broker discount (min NT$20 per board-lot
// order, NT$1 for odd lots), securities transaction tax on sells 0.3%
// (ETFs, codes starting 00, 0.1%). Pre-filled, always editable.
function loadDiscount() { try { return Number(localStorage.getItem("feeDiscount")) || 1; } catch (_) { return 1; } }
function saveDiscount(v) { try { localStorage.setItem("feeDiscount", String(v)); } catch (_) {} }
function brokerFee(amount, shares, discount) {
  if (!(amount > 0)) return 0;
  return Math.max(shares % 1000 === 0 ? 20 : 1, Math.floor(amount * 0.001425 * discount));
}
const sellTax = (amount, sid) => Math.floor(amount * (String(sid).startsWith("00") ? 0.001 : 0.003));

// Mark one real lot to market: cost includes its share of the buy fee,
// netNow also deducts the estimated sell fee + tax (what you'd pocket).
function valueLot(m) {
  const q = quotes[m.stock_id];
  const n = m.remaining, bp = Number(m.buy_price);
  const cost = bp * n + m.feeLeft;
  const price = q ? Number(q.price) : bp;
  const value = price * n;
  return {q, n, bp, cost, price, value,
    netNow: value - brokerFee(value, n, loadDiscount()) - sellTax(value, m.stock_id) - cost,
    dayChange: q && q.prev_close ? (price - Number(q.prev_close)) * n : 0,
    pnlPct: (price / bp - 1) * 100};
}
const heldIds = () => new Set(ledger.lots.map(l => l.stock_id));

const ym = d => String(d || "").slice(0, 7);

function renderRecords() {
  const el = document.getElementById("page-records");
  if (!profile) {

    return;
  }

  const total = t.reduce((a, x) => a + x.pnl, 0), fees = t.reduce((a, x) => a + x.fees, 0);
  const wins = t.filter(x => x.pnl > 0).length;
  let h = `<div class="section-title">📊 已實現損益（扣手續費與稅）</div>
    <div class="card"><div class="stat-grid">
      <div class="stat-box"><div class="num ${total >= 0 ? "g" : "r"}">${nt(total)}</div><div class="label">累計淨損益</div></div>

      <div class="stat-box"><div class="num">${t.length}</div><div class="label">賣出筆數</div></div>
      <div class="stat-box"><div class="num">NT$${Math.round(fees).toLocaleString()}</div><div class="label">手續費＋稅</div></div>
    </div></div>`;

  // Monthly: realized P/L by sell month, buy volume by buy month.
  const months = {};
  const mo = k => months[k] ||= {pnl: 0, n: 0, fees: 0, bought: 0};
  t.forEach(x => { const m = mo(ym(x.exit_date)); m.pnl += x.pnl; m.n++; m.fees += x.fees; });
  buys.forEach(b => { mo(ym(b.buy_date)).bought += Number(b.buy_price) * Number(b.shares); });
  const keys = Object.keys(months).sort().reverse();
  h += `<div class="section-title">📅 每月損益</div><div class="card"><table class="month-table">
    <tr><th>月份</th><th>買進金額</th><th>賣出筆數</th><th>費用</th><th>已實現淨損益</th></tr>` +
    keys.map(k => { const m = months[k]; return `<tr><td>${k.replace("-", "/")}</td>
      <td>${m.bought ? Math.round(m.bought).toLocaleString() : "—"}</td><td>${m.n || "—"}</td>
      <td>${m.fees ? Math.round(m.fees).toLocaleString() : "—"}</td>
      <td style="font-weight:800;color:${m.n ? (m.pnl >= 0 ? "var(--green)" : "var(--red)") : "var(--text-dim)"}">${m.n ? nt(m.pnl) : "—"}</td></tr>`; }).join("") +
    `</table></div>`;

  // Every buy and sell, newest first, grouped by month.
  const events = [
    ...buys.map(b => ({kind: "buy", date: b.buy_date, row: b})),
    ...t.map(x => ({kind: "sell", date: x.exit_date, row: x})),
  ].sort((a, b) => String(b.date).localeCompare(String(a.date)) || (a.kind === "sell" ? -1 : 1));
  h += `<div class="section-title">🧾 所有買賣明細 <span class="count">${events.length}</span></div>`;
  let cur = "";
  h += events.map(ev => {
    const r = ev.row, head = ym(ev.date) !== cur ? `${cur ? "</div>" : ""}<div class="month-head">${ym(ev.date).replace("-", " 年 ")} 月</div><div class="card">` : "";
    cur = ym(ev.date);
    const nm = names[r.stock_id] ? " " + esc(names[r.stock_id]) : "";
    if (ev.kind === "buy") {
      const fee = Number(meta(r).fee || 0), amt = Number(r.buy_price) * Number(r.shares) + fee;
      return head + `<div class="ev-row"><span class="ev-kind buy">買</span>

          <span class="sub"><br>${md(r.buy_date)} · 手續費 ${fee}
          · <button class="void-link" data-void="${esc(r.id)}" data-label="${esc(r.stock_id)} ${md(r.buy_date)} 買入 ${r.shares} 股">刪除</button></span></span>
        <span class="ev-amt">−NT$${Math.round(amt).toLocaleString()}</span></div>`;
    }
    return head + `<div class="ev-row"><span class="ev-kind sell">賣</span>
      <span class="ev-body"><b>${esc(r.stock_id)}${nm}</b>　${Number(r.shares).toLocaleString()} 股 @${f2(r.exit_price)}
        <span class="sub"><br>${md(r.exit_date)} · 買入 ${md(r.buy_date)} @${f2(r.buy_price)} · 費用 ${Math.round(r.fees)}
        ${r.exit_reason ? "· " + esc(r.exit_reason) : ""}
        · <button class="void-link" data-void="${esc(r.id)}" data-label="${esc(r.stock_id)} ${md(r.exit_date)} 賣出 ${r.shares} 股">刪除</button></span></span>
      <span class="ev-amt" style="color:${r.pnl >= 0 ? "var(--green)" : "var(--red)"}">${nt(r.pnl)}<br>
        <small>${fmtPct(r.pnlPct)}</small></span></div>`;
  }).join("") + (events.length ? "</div>" : "");

  h += `<div class="footer-note">損益 = 賣出實收（扣手續費、證交稅）− 買進成本（含手續費）</div>`;
  el.innerHTML = h;
}

        <div class="stat-box"><div class="num">${(wins.length / closed.length * 100).toFixed(1)}%</div>
          <div class="label">勝率（${wins.length}勝${losses.length}敗）</div></div>
        <div class="stat-box"><div class="num g">${avg(wins).toFixed(2)}%</div><div class="label">平均賺</div></div>
        <div class="stat-box"><div class="num r">${avg(losses).toFixed(2)}%</div><div class="label">平均賠</div></div>
      </div></div>`;
  }

  h += `<div class="section-title">📌 模擬持倉 <span class="count">${openPositions.length}</span></div>`;
  h += openPositions.length
    ? openPositions.map(p => ((p.below_ma20_days || 0) === 1 ? `<div class="watch-note" style="margin-bottom:6px">
        ⚠️ ${esc(p.stock_id)} 收盤第 1 天跌破月線 — 明天再收在月線下就出場</div>` : "") + holdingCard(p, "sim")).join("")
    : `<div class="card" style="text-align:center;color:var(--text-dim);font-size:13px">目前無模擬持倉</div>`;

  h += `<div class="section-title">📁 模擬平倉紀錄 <span class="count">${closed.length}</span></div>`;
  h += closed.length ? `<div class="card">` + closed.map(t => `<div class="hist-row">
      <span class="id">${esc(t.stock_id)}</span>
      <span class="dates">${names[t.stock_id] ? esc(names[t.stock_id]) + "　" : ""}${md(t.entry_date)} @${f2(t.entry_price)} →
        ${md(t.exit_date)} @${f2(t.exit_price)}<br>${esc(t.exit_reason || "")}</span>
      <span class="pnl" style="color:${Number(t.pnl_pct) >= 0 ? "var(--green)" : "var(--red)"}">${fmtPct(t.pnl_pct)}</span>
    </div>`).join("") + `</div>`
    : `<div class="card" style="text-align:center;color:var(--text-dim);font-size:13px">尚無平倉紀錄</div>`;

  h += `<div class="footer-note">以上為系統模擬帳戶的實際紀錄（非歷史回測），非投資建議</div>`;
  el.innerHTML = h;
}

function requireProfile() {
  if (profile) return true;
  if (liffReady && confirm("需要先用 LINE 登入才能記錄真實持倉，現在登入？")) {
    liff.login({redirectUri: location.href});
  } else if (!liffReady) {
    alert("無法取得 LINE 身分，請從 LINE 聊天室裡的連結開啟此頁再記錄。");
  }
  return false;
}

async function insertRow(payload) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/positions_manual", {
    method: "POST",
    headers: {...sbHeaders, "Content-Type": "application/json"},
    body: JSON.stringify([{line_user_id: profile.userId, ...payload}]),
  });
  if (!r.ok) {
    const body = await r.text();
    if (r.status === 401 || r.status === 403 || body.includes("row-level security")) {
      throw new Error("資料庫拒絕寫入（positions_manual 缺少 RLS insert 權限）\n" + body.slice(0, 200));
    }
    throw new Error(`HTTP ${r.status}\n` + body.slice(0, 300));
  }
}

async function saveAndReload(dlg, btn, payload, tab) {
  btn.disabled = true;
  try {
    await insertRow(payload);
    dlg?.close();
    await load();
    document.querySelector(`.tab[data-page="${tab}"]`).click();
  } catch (err) {
    alert("儲存失敗：" + err.message);
  } finally {
    if (btn) btn.disabled = false;
  }
}

function wireDialog() {
  const dlg = document.getElementById("log-dialog");
  const form = document.getElementById("log-form");
  const sdlg = document.getElementById("sell-dialog");
  const sform = document.getElementById("sell-form");
  let selling = null;  // the lot being sold

  // Buy: recompute the default fee whenever price/shares/discount change,
  // unless the user typed their own fee.
  let buyFeeTouched = false;
  const buyCalc = () => {
    const price = num(form.buy_price.value), n = num(form.shares.value);
    const disc = num(form.discount.value) || 1;
    const amount = price * n;
    if (!buyFeeTouched) form.fee.value = amount > 0 ? brokerFee(amount, n, disc) : "";
    const fee = num(form.fee.value) || 0;
    document.getElementById("buy-calc").innerHTML = amount > 0
      ? `成交金額 <b>NT$${Math.round(amount).toLocaleString()}</b> ＋ 手續費 <b>${fee}</b>
         ＝ 總成本 <b>NT$${Math.round(amount + fee).toLocaleString()}</b>` : "";
  };
  form.fee.addEventListener("input", () => { buyFeeTouched = form.fee.value !== ""; buyCalc(); });
  ["buy_price", "shares", "discount"].forEach(k => form[k].addEventListener("input", buyCalc));
  const openBuy = (sid = "", price = "") => {
    form.reset();
    buyFeeTouched = false;
    form.stock_id.value = sid;
    form.buy_price.value = price;
    form.buy_date.value = twToday();
    form.discount.value = loadDiscount() === 1 ? "" : loadDiscount();
    buyCalc();
    dlg.showModal();
  };

  // Sell: same idea, plus the securities transaction tax and a P/L preview.
  let sellFeeTouched = false, sellTaxTouched = false;
  const sellCalc = () => {
    if (!selling) return;
    const price = num(sform.price.value), n = num(sform.shares.value);
    const amount = price * n;
    if (!sellFeeTouched) sform.fee.value = amount > 0 ? brokerFee(amount, n, loadDiscount()) : "";
    if (!sellTaxTouched) sform.tax.value = amount > 0 ? sellTax(amount, selling.stock_id) : "";
    const fee = num(sform.fee.value) || 0, tax = num(sform.tax.value) || 0;
    const buyFee = selling.fee * n / Number(selling.shares);
    const cost = Number(selling.buy_price) * n + buyFee;
    const net = amount - fee - tax;
    document.getElementById("sell-calc").innerHTML = amount > 0 && n <= selling.remaining
      ? `賣出金額 NT$${Math.round(amount).toLocaleString()} − 手續費 ${fee} − 證交稅 ${tax}
         ＝ 實收 <b>NT$${Math.round(net).toLocaleString()}</b><br>
         成本 NT$${Math.round(cost).toLocaleString()}（含買進手續費 ${Math.round(buyFee)}）→
         淨損益 <b style="color:${net - cost >= 0 ? "var(--green)" : "var(--red)"}">${nt(net - cost)}
         （${fmtPct((net / cost - 1) * 100)}）</b>`
      : n > selling.remaining ? `<span style="color:var(--red)">最多只能賣 ${selling.remaining} 股</span>` : "";
  };
  sform.fee.addEventListener("input", () => { sellFeeTouched = sform.fee.value !== ""; sellCalc(); });
  sform.tax.addEventListener("input", () => { sellTaxTouched = sform.tax.value !== ""; sellCalc(); });
  ["price", "shares"].forEach(k => sform[k].addEventListener("input", sellCalc));

  document.body.addEventListener("click", async e => {
    if (e.target.closest("[data-close]")) { e.target.closest("dialog").close(); return; }
    const go = e.target.closest("[data-goto]");
    if (go) { document.querySelector(`.tab[data-page="${go.dataset.goto}"]`).click(); return; }
    const logBtn = e.target.closest("[data-log]");
    if (logBtn) { openBuy(logBtn.dataset.log, logBtn.dataset.price || ""); return; }
    if (e.target.id === "line-login") { liff.login({redirectUri: location.href}); return; }
    if (e.target.id === "add-holding") { openBuy(); return; }

    const sellBtn = e.target.closest("[data-sell]");
    if (sellBtn) {
      selling = ledger.lots.find(l => l.id === sellBtn.dataset.sell);
      if (!selling) return;
      sform.reset();
      sellFeeTouched = sellTaxTouched = false;
      const q = quotes[selling.stock_id];
      document.getElementById("sell-title").textContent =
        `記錄賣出 ${selling.stock_id} ${names[selling.stock_id] || ""}（持有 ${selling.remaining} 股）`;
      sform.price.value = q ? q.price : "";
      sform.shares.value = selling.remaining;
      sform.date.value = twToday();
      sellCalc();
      sdlg.showModal();
      return;
    }

    const voidBtn = e.target.closest("[data-void]");
    if (voidBtn) {
      if (!requireProfile()) return;
      const linked = ledger.trades.filter(t => meta(t).ref === voidBtn.dataset.void).length;
      if (!confirm(`確定刪除「${voidBtn.dataset.label}」這筆紀錄？\n（資料庫會保留一筆作廢註記，畫面上不再顯示）` +
          (linked ? `\n\n注意：這筆買入已有 ${linked} 筆賣出紀錄，賣出紀錄會保留（損益仍計入），如也要刪請到交易紀錄逐筆刪除` : ""))) return;
      const row = ledger.byId[voidBtn.dataset.void] || ledger.trades.find(t => t.id === voidBtn.dataset.void);
      await saveAndReload(null, voidBtn, {
        stock_id: row?.stock_id || "0000", shares: 0, buy_price: 0, buy_date: twToday(),
        status: "void", note: JSON.stringify({ref: voidBtn.dataset.void}),
      }, document.querySelector(".tab.active")?.dataset.page || "page-holdings");
    }
  });

  form.onsubmit = async ev => {
    ev.preventDefault();
    if (!requireProfile()) return;
    const price = num(form.buy_price.value), n = num(form.shares.value);
    const disc = num(form.discount.value);
    const fee = Math.round(num(form.fee.value) || 0);
    const sid = form.stock_id.value.trim();
    if (!/^\d{4,6}[A-Z]?$/.test(sid) || !(price > 0) || !(n > 0) || !Number.isInteger(n)) {
      alert("請確認代號、買入價與股數（股數需為整數）");
      return;
    }
    if (disc > 0 && disc <= 1) saveDiscount(disc);
    await saveAndReload(dlg, form.querySelector(".btn-save"), {
      stock_id: sid, buy_price: price, shares: n, buy_date: form.buy_date.value,
      // cost_total is a generated column (buy_price × shares) — never sent;
      // the buy fee lives in note.fee.
      status: "open", note: JSON.stringify({fee}),
    }, "page-holdings");
  };

  sform.onsubmit = async ev => {
    ev.preventDefault();
    if (!requireProfile() || !selling) return;
    const price = num(sform.price.value), n = num(sform.shares.value);
    if (!(price > 0) || !(n > 0) || !Number.isInteger(n) || n > selling.remaining) {
      alert(`請確認賣出價與股數（1～${selling.remaining} 股的整數）`);
      return;
    }
    const fee = Math.round(num(sform.fee.value) || 0), tax = Math.round(num(sform.tax.value) || 0);
    await saveAndReload(sdlg, sform.querySelector(".btn-save"), {
      stock_id: selling.stock_id, shares: n,
      // the lot's buy side, so every sale row is self-contained for analysis
      buy_price: Number(selling.buy_price), buy_date: selling.buy_date,
      exit_price: price, exit_date: sform.date.value, exit_reason: sform.reason.value.trim() || null,
      status: "sell", note: JSON.stringify({ref: selling.id, fee, tax}),
    }, "page-records");
  };
}

async function load() {
  const today = twToday();
  const [stateRows, openRows, closedRows, manualRows, quoteRows] = await Promise.all([
    sbGet("daily_state?order=run_date.desc&limit=1"),
    sbGet("simulated_positions?status=eq.open&order=entry_date.asc"),
    sbGet("simulated_positions?status=eq.closed&order=exit_date.desc&limit=50"),
    profile
      ? sbGet(`positions_manual?line_user_id=eq.${encodeURIComponent(profile.userId)}&order=buy_date.desc,created_at.desc`)
      : Promise.resolve([]),
    // Written by the screener's intraday job; if it's missing the page still
    // renders, just without live prices/names.
    fetch(SUPABASE_URL + "/storage/v1/object/public/dashboard/quotes.json?t=" + Date.now())
      .then(r => r.ok ? r.json() : {quotes: {}})
      .then(j => { if (j.rules) rules = {...rules, ...j.rules}; return Object.values(j.quotes || {}); })
      .catch(e => { console.warn("quotes.json:", e); return []; }),
  ]);

  const state = stateRows[0] || null;
  const exits = state && state.run_date === today ? (state.exits_today || []) : [];

  quotes = Object.fromEntries(quoteRows.map(q => [q.stock_id, q]));
  names = {};
  for (const r of [...(state?.long_candidates || []), ...(state?.exits_today || []), ...quoteRows]) {
    if (r.stock_name) names[r.stock_id] = r.stock_name;
  }

  buildLedger(manualRows);
  renderToday(state, exits);
  renderHoldings();
  renderRecords();
  renderSim(openRows, closedRows);

  document.getElementById("boot").hidden = true;
  document.getElementById("tabbar").hidden = false;
  document.getElementById("page-today").classList.add("active");
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-page").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.page).classList.add("active");
  });
});

(async () => {
  wireDialog();
  try {
    await liff.init({liffId: LIFF_ID});
    liffReady = true;
    if (liff.isLoggedIn()) {
      profile = await liff.getProfile();
    } else if (liff.isInClient()) {
      liff.login();
      return;
    } else {
      // Opened as a plain URL (LINE's normal in-app browser, Safari…): log in
      // automatically once per session so the rich-menu link "just works".
      // The flag stops a redirect loop if login is cancelled or fails; after
      // that the holdings tab still offers a manual "用 LINE 登入" button.
      let tried = false;
      try { tried = sessionStorage.getItem("liffLoginTried") === "1"; } catch (_) {}
      if (!tried) {
        try { sessionStorage.setItem("liffLoginTried", "1"); } catch (_) {}
        liff.login({redirectUri: location.href});
        return;
      }
    }
  } catch (e) {
    // Opened outside LINE (plain browser) — still usable read-only; the
    // manual-holdings list just can't be tied to a LINE identity.
    console.warn("LIFF unavailable:", e);
    liffError = "LIFF 無法啟動：" + (e && e.message ? e.message : String(e));
  }
  try {
    await load();
  } catch (e) {
    document.getElementById("boot").innerHTML =
      `<div class="error-box">資料載入失敗：${esc(e.message)}</div>`;
  }
})();

// Prices move during the session; re-pull when the page comes back to the
// foreground (switching back to LINE) and every few minutes while open.
async function refresh() {
  if (document.visibilityState !== "visible" || document.querySelector("dialog[open]")) return;
  const active = document.querySelector(".tab.active")?.dataset.page;
  try { await load(); } catch (e) { console.warn("refresh failed:", e); return; }
  if (active) document.querySelector(`.tab[data-page="${active}"]`).click();
}
document.addEventListener("visibilitychange", refresh);
setInterval(refresh, 5 * 60e3);
</script>
